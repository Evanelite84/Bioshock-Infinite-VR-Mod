; BioShock Infinite VR - controller mapping
;
; Your motion controllers are presented to the game as a DirectInput gamepad. This file
; decides which virtual axis/button each physical control SENDS; the game's own bindings
; decide what that then DOES.
;
;     controller input  --[ this file ]-->  gamepad axis/button  --[ the game ]-->  action
;
; RELOADS LIVE, about once a second. Edit it, alt-tab, test. No restart needed.
;
; It lives next to the DLL on purpose: Windows cleans %TEMP%, and a settings file that
; silently vanishes is worse than no settings file.
;
; The values below are measured, not guessed - see the index map near the bottom.


; ============================================================================
; STICKS AND TRIGGERS  ->  gamepad axes
; ============================================================================
; Valid axes: X Y Z RX RY RZ NONE
;
; Which axis a game listens to is NOT standardised. BioShock reads Z as horizontal look:
; putting the triggers there made them steer the player, and putting the right stick on
; RX/RY meant it did nothing at all.
;
; The two symptoms worth knowing:
;   a stick does nothing               -> it is on an axis the game ignores; try Z / RZ
;   something steers that should not   -> it shares the axis the game uses for look

LeftStickXAxis   = X      ; strafe
LeftStickYAxis   = Y      ; forward / back
RightStickXAxis  = Z      ; the game maps the right stick here
RightStickYAxis  = RZ
LeftTriggerAxis  = RX
RightTriggerAxis = RY

; These are CORRECTION knobs, not preferences. "1" does not mean "I want inverted aim" - it
; means "this axis arrives upside down, flip it back". The only test that matters: push up.
; If the view goes up, the value is right, whatever the number says.
InvertLeftX  = 0
InvertLeftY  = 0
InvertRightX = 0
InvertRightY = 0


; ============================================================================
; BUTTONS
; ============================================================================
; Which DirectInput button number each control reports as. -1 disables it.
;
; NOTE: BioShock's MENU and its GAMEPLAY bindings read DIFFERENT indices, so a layout that
; is correct in one can be wrong in the other. If menu-confirm lands on the wrong button,
; swap numbers until it goes where you want. This reloads live, so each attempt costs
; seconds rather than a restart.
;
; On Quest-style controllers: A/B are on the RIGHT, X/Y on the LEFT.

ButtonA = 0               ; jump
ButtonB = 3               ; crouch / reload (index 3 is context-sensitive and does both)
ButtonX = 2               ; use / items
ButtonY = 1               ; melee
ButtonMenu = 8            ; Select - opens the menu

; Fire lives on the triggers, where a shooter belongs.
;
; This is also half of the phantom-fire fix: an idle controller parks its analogue inputs
; high - a grip was measured spiking to 0.882, well past the 0.5 button threshold - so with
; fire on the grips, a controller left on a desk would shoot and cast on its own. The other
; half is in the mod itself: a trigger's value is ignored unless that trigger's capacitive
; TOUCH sensor reports a finger on it. You cannot pull a trigger without touching it.
ButtonRightTrigger = 5    ; fire gun
ButtonLeftTrigger  = 4    ; fire vigor

ButtonRightGrip = 7       ; weapon swap
ButtonLeftGrip  = 6       ; vigor swap

ButtonLeftStickClick  = 10  ; sprint - must be HELD while already moving forward
ButtonRightStickClick = 9   ; Start / pause


; ============================================================================
; THE INDEX MAP - measured by pressing every control and reading the result.
; Use this if you want to remap something.
; ============================================================================
;    0 = jump            1 = melee           2 = use / items     3 = crouch AND reload
;    4 = fire vigor      5 = fire gun        6 = vigor swap      7 = weapon swap
;    8 = Select          9 = Start / pause  10 = sprint / run   11 = zoom
;   12, 13, 14, 15 = nothing
;
; Index 3 drives BOTH crouch and reload - context-sensitive, like the original console
; layout - which is why B covers reload and no separate reload button is needed.
;
; If you go probing for more: test a candidate under the conditions the action actually
; needs. Sprint sat on index 10 and was written off as dead for a long time because every
; probe was a short tap while standing still, and sprint does nothing unless it is held
; while already moving. Reload is likewise invisible on a full magazine.


; ============================================================================
; FEEL
; ============================================================================
Deadzone   = 0.15         ; radial, 0.0 - 0.9. Raise for drift, lower for finer aim.
SwapSticks = 0            ; 1 swaps move and look entirely
